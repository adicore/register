<!DOCTYPE html>
<html lang="en">

<head>
    <meta content='noindex,nofollow' name='robots' />
    <link href='{{CANONICAL_URL}}' rel='canonical' />
    <link href='{{CANONICAL_URL}}' rel='alternate' />
    <meta content='{{CANONICAL_URL}}' property='og:url' />
    <meta content='{{CANONICAL_URL}}' name='twitter:url' />
    <meta content='{{SITE_URL}}' name='twitter:domain' />
    <meta content='website' property='og:type' />
    <meta content='en' property='og:locale' />
    <meta content='text/html; charset=UTF-8' http-equiv='Content-Type' />
    <meta content='IE=edge' http-equiv='X-UA-Compatible' />
    <meta charset='utf-8' />
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=5' name='viewport' />
    <meta content='summary_large_image' name='twitter:card' />
    <meta content='{{META_DESCRIPTION}}' name='twitter:description' />
    <meta content='{{META_DESCRIPTION}}' name='description' />
    <meta content='{{META_DESCRIPTION}}' property='og:description' />
    <meta content='1200' property='og:image:width' />
    <meta content='630' property='og:image:height' />
    <meta content='{{SITE_TITLE}}' property='og:site_name' />
    <meta content='en' name='geo.country' />
    <meta content='{{META_IMAGE}}' name='twitter:image' />
    <meta content='{{META_IMAGE}}' property='og:image' />
    <script type='application/ld+json'>
        {
            "@context": "http://schema.org",
            "@type": "Organization",
            "url": "{{CANONICAL_URL}}",
            "logo": "{{LOGO_URL}}"
        }
    </script>
    <script id='ldjson' type='application/ld+json'>
        {
            "@context": "http://schema.org",
            "@type": "Website",
            "name": "{{SITE_TITLE}}",
            "url": "{{CANONICAL_URL}}",
            "potentialAction": {
                "@type": "SearchAction",
                "target": "{{SITE_URL}}?search?q={search_term_string}",
                "query-input": "required name=search_term_string"
            }
        }
    </script>
    <title>{{META_TITLE}} {{TITLE_SEPARATOR}} {{SITE_TITLE}}</title>
    <meta content='{{META_TITLE}}' property='og:image:alt' />
    <meta content='{{META_TITLE}}' property='og:title' />
    <meta content='{{META_TITLE}}' name='twitter:title' />
    <meta content='{{META_TITLE}}' name='twitter:image:alt' />{{GOOGLE_VERIFY}}{{BING_VERIFY}}{{YANDEX_VERIFY}}
    <meta content='https://www.facebook.com/' property='article:publisher' />
    <meta content='https://www.facebook.com/' property='article:author' />
    <meta content='' property='fb:pages' />
    <meta content='' name='twitter:site' />
    <meta content='' name='twitter:creator' />
    <meta content='' property='fb:app_id' />
    <meta content='' property='fb:admins' />
    <script id='ldjson2' type='application/ld+json'>
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "{{SITE_TITLE}}",
            "url": "{{CANONICAL_URL}}",
            "sameAs": ["{{SOCIAL_FACEBOOK}}", "{{SOCIAL_TWITTER}}", "{{SOCIAL_INSTAGRAM}}", "{{SOCIAL_LINKEDIN}}", "{{SOCIAL_TIKTOK}}", "{{SOCIAL_YOUTUBE}}"]
        }
    </script>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org/",
            "@type": "Person",
            "name": "{{AUTHOR_NAME}}",
            "url": "{{SITE_URL}}",
            "image": "{{AUTHOR_AVATAR}}"
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin fetchpriority="high">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap" rel="stylesheet" fetchpriority="high">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" fetchpriority="high">
    <link rel="stylesheet" href="/assets/css/bootstrap-icons.min.css" fetchpriority="low">
    <script delay="https://cdnjs.cloudflare.com/ajax/libs/lazysizes/5.3.2/lazysizes.min.js" async fetchpriority="low"></script>
    <link rel="stylesheet" href="/assets/css/style.css" fetchpriority="high">
</head>

<body class="bg-light">
    <header class="bg-white sticky-top shadow-sm"> {{HEADER_TOPBAR}} {{HEADER_NAV}}
        <script type="application/ld+json">
            {
                "@context": "https://schema.org/",
                "@type": "BreadcrumbList",
                "itemListElement": [{
                    "@type": "ListItem",
                    "position": 1,
                    "name": "Homepage",
                    "item": "{{SITE_URL}}"
                }, {
                    "@type": "ListItem",
                    "position": 2,
                    "name": "{{META_TITLE}}",
                    "item": "{{CANONICAL_URL}}"
                }]
            }
        </script>
    </header>

    <div class="container my-3">
        <div class="bg-white border rounded-4 p-3 text-center shadow-sm"><span class="badge bg-secondary bg-opacity-10 text-secondary mb-1 px-2 py-1 rounded small" style="font-size: 0.7rem;">Ad</span>
            <div class="py-2 bg-light rounded text-muted fw-semibold"> 📢 {{TOP_POST_AD}}</div>
        </div>
    </div>

    <section class="bg-white border-bottom py-5">
        <div class="container text-center py-3">
            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill fw-bold mb-2" id="cat-tag">Article Category</span>
            <h1 class="display-5 fw-bold text-dark mb-2" id="archiveTitle">Memuat Archive...</h1>
            <p class="text-secondary mb-0" id="archiveDesc" style="max-width: 600px; margin: 0 auto;">Showing all posts and interesting guides.</p>
        </div>
    </section>

    <main class="container py-5 my-2">
        <div class="row g-4" id="postsContainer">
            <!-- Loader Awal -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
        </div>
    </main>

    {{BLOCK:subscribe-global}} {{FOOTER_WIDGETS}} {{MODALS}}

    <script delay="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/main.js" defer></script>

    <!-- CLIENT-SIDE MASTER ARCHIVE RENDERER -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const rawPath = window.location.pathname.replace(/\/+\$/, '');
            const segments = rawPath.split('/').filter(Boolean);
            const isTag = rawPath.toLowerCase().includes('/tag');

            const badgeEl = document.getElementById('cat-tag');
            const titleEl = document.getElementById('archiveTitle');
            const descEl = document.getElementById('archiveDesc');
            const postsContainer = document.getElementById('postsContainer');

            if (badgeEl) badgeEl.innerText = isTag ? 'Article Tag' : 'Article Category';
            const typeIndex = segments.findIndex(s => s === 'category' || s === 'tag');
            
            let slug = (typeIndex !== -1 && segments[typeIndex + 1]) ? segments[typeIndex + 1] : '';
            slug = decodeURIComponent(slug).replace(/\.html\$/i, '').toLowerCase().trim();

            if (!slug) {
                if (titleEl) titleEl.innerText = isTag ? 'Tag Archive' : 'Category Archive';
                if (postsContainer) postsContainer.innerHTML = '<div class="col-12 text-center py-5 text-muted">Silakan pilih kategori atau tag yang ingin ditampilkan.</div>';
                return;
            }

            const jsonUrl = isTag ? '/json/tags.json' : '/json/categories.json';

            try {
                const res = await fetch(jsonUrl);
                if (!res.ok) throw new Error('Data master JSON tidak ditemukan');
                const masterData = await res.json();
                
                const data = masterData[slug];
                if (!data) throw new Error('Arsip tidak ditemukan');

                const archiveName = data.name || slug;

                if (titleEl) titleEl.innerText = archiveName;
                if (descEl) descEl.innerText = `Showing all posts and interesting guides regarding ${archiveName}.`;
                
                const siteName = '{{SITE_TITLE}}'.includes('SITE_TITLE') ? 'Archive' : '{{SITE_TITLE}}';
                document.title = `${archiveName} - ${siteName}`;

                const metaDescEl = document.querySelector('meta[name="description"]');
                if (metaDescEl) metaDescEl.setAttribute('content', `Showing all posts and interesting guides regarding ${archiveName}.`);

                if (!data.posts || data.posts.length === 0) {
                    if (postsContainer) postsContainer.innerHTML = '<div class="col-12 text-center py-5 text-muted">Belum ada artikel dalam arsip ini.</div>';
                    return;
                }

                postsContainer.innerHTML = data.posts.map(post => `
                    <div class="col-lg-4 col-md-6">
                        <article class="card border-0 shadow-sm rounded-4 overflow-hidden card-hover h-100 bg-white">
                            <div class="position-relative">
                                <a href="${post.url}">
                                    <div class="image-shimmer-effect" style="height: 220px;">
                                        <img src="${post.thumbnail || 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=='}" 
                                             width="600" height="400" 
                                             class="lazyload lazy-effect w-100 h-100 object-fit-cover" 
                                             alt="${post.title || ''}">
                                    </div>
                                </a>
                                <span class="badge bg-white text-dark position-absolute top-0 start-0 m-3 rounded-pill px-3 py-2 shadow-sm small fw-bold z-2">
                                    <i class="bi bi-folder text-primary me-1"></i>${post.category || 'General'}
                                </span>
                            </div>
                            <div class="card-body p-4 d-flex flex-column justify-content-between">
                                <div>
                                    <div class="text-muted small mb-2"><i class="bi bi-calendar3 me-1"></i>${post.date || ''} • by ${post.author || 'Admin'}</div>
                                    <a href="${post.url}"><h2 class="fw-bold mb-3 text-dark fs-5 lh-sm">${post.title}</h2></a>
                                    <p class="text-secondary small mb-4 lh-base">${post.description || ''}</p>
                                </div>
                                <a href="${post.url}" class="text-primary fw-bold text-decoration-none small d-flex align-items-center gap-1">
                                    Read more <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </article>
                    </div>
                `).join('');

            } catch (err) {
                console.error('Archive load error:', err);
                if (titleEl) titleEl.innerText = 'Arsip Tidak Ditemukan';
                if (postsContainer) {
                    postsContainer.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-exclamation-circle text-danger display-4 d-block mb-3"></i>
                            <p class="text-muted">Maaf, halaman arsip yang Anda cari tidak ditemukan atau belum memiliki postingan.</p>
                            <a href="/" class="btn btn-primary rounded-pill px-4">Kembali ke Beranda</a>
                        </div>
                    `;
                }
            }
        });
    </script>
</body>

</html>
