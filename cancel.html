<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Dibatalkan - SaaS CMS Dashboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }
        .card { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 450px; 
            width: 90%; 
        }
        .icon-warning { 
            font-size: 65px; 
            margin-bottom: 15px; 
        }
        h2 { 
            color: #333; 
            margin-top: 0; 
            margin-bottom: 10px;
        }
        p { 
            color: #666; 
            line-height: 1.5; 
            margin-bottom: 25px; 
            font-size: 15px;
        }
        .btn { 
            display: inline-block; 
            width: 100%; 
            background: #ff6600; 
            color: white; 
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            text-decoration: none; 
            box-sizing: border-box; 
            transition: background 0.2s;
        }
        .btn:hover { 
            background: #e55b00; 
        }
        .support-text {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
        .support-text a {
            color: #ff6600;
            text-decoration: none;
        }
        .support-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Ikon Peringatan/Batal -->
    <div class="icon-warning">⚠️</div>
    
    <h2>Pembayaran Dibatalkan</h2>
    <p>Anda telah membatalkan proses checkout di PayPal. Jangan khawatir, <strong>tidak ada dana yang ditarik</strong> dari akun Anda.</p>
    
    <!-- Tombol Kembali ke Halaman Utama -->
    <a href="index.html" class="btn">Kembali ke Halaman Pendaftaran</a>
    
    <div class="support-text">
        Mengalami kendala saat pembayaran? <br>
        Silakan <a href="mailto:support@travego.site">hubungi tim bantuan kami</a>.
    </div>
</div>

<script>
    // Opsional: Membersihkan data pendaftaran yang tertinggal di local storage 
    // jika klien membatalkan pesanan, agar saat mendaftar lagi form benar-benar bersih.
    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem('travego_setup_data')) {
            localStorage.removeItem('travego_setup_data');
        }
    });
</script>

</body>
</html>
