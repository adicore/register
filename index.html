<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Klien Otomatis - SaaS Travego</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #ff6600; color: white; border: none; padding: 12px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e55b00; }
        #responseMessage { margin-top: 20px; padding: 10px; border-radius: 4px; text-align: center; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Setup Klien Otomatis</h2>
    <form id="registerForm">
        <div class="form-group">
            <label>Nama Klien / Perusahaan:</label>
            <input type="text" id="name" required placeholder="Contoh: Budi Santoso">
        </div>
 <div class="form-group">
<label for="clientEmail">Email Admin Klien:</label>
<input type="email" id="clientEmail" placeholder="email.klien@gmail.com" required>
        </div>
        <div class="form-group">
            <label>Domain Klien</label>
            <input type="text" id="domain" placeholder="Contoh: travelbudi.com">
        </div>
        <div class="form-group">
            <label>Cloudflare Account ID:</label>
            <input type="text" id="accountId" required placeholder="Masukkan Account ID Cloudflare klien">
        </div>
        <div class="form-group">
            <label>Cloudflare API Token:</label>
            <input type="password" id="token" required placeholder="Token dengan akses Workers & KV & D1">
        </div>
        <div class="form-group">
            <label>Nama Worker</label>
            <input type="text" id="workerName" required placeholder="Contoh: cms-budi">
        </div>
        <div class="form-group">
            <label>KV Namespace ID (Klien):</label>
            <input type="text" id="kvId" required placeholder="ID KV Namespace di akun klien">
        </div>
        <div class="form-group">
            <label>D1 Database ID (Klien):</label>
            <input type="text" id="databaseId" required placeholder="ID Database D1 di akun klien">
        </div>
        <!-- KELOMPOK INPUT VARIABEL (Teks Biasa) -->
<div class="form-group mb-3">
  <label for="githubOwner">GitHub Owner / Username Klien</label>
  <input type="text" id="githubOwner" class="form-control" placeholder="Contoh: nama-klien" required>
</div>

<div class="form-group mb-3">
  <label for="githubRepo">Nama Repositori GitHub</label>
  <input type="text" id="githubRepo" class="form-control" placeholder="Contoh: my-blog-repo" required>
</div>

<!-- KELOMPOK INPUT SECRETS (Rahasia) -->
<div class="form-group mb-3">
  <label for="githubPat">GitHub Personal Access Token (PAT)</label>
  <input type="password" id="githubPat" class="form-control" placeholder="ghp_xxxxxxxxxxxx" required>
</div>

<div class="form-group mb-3">
  <label for="groqApiKey">Groq API Key</label>
  <input type="password" id="groqApiKey" class="form-control" placeholder="gsk_xxxxxxxxxxxx" required>
</div>
        
        <button type="submit" id="submitBtn">Daftar & Deploy Otomatis</button>
    </form>

    <div id="responseMessage"></div>
</div>

<script>
// Pastikan ID form Anda adalah 'registerForm' (sesuaikan jika berbeda)
document.getElementById('registerForm').addEventListener('submit', async function(event) {
    // Mencegah form melakukan reload halaman bawaan browser
    event.preventDefault();

    // 1. Ambil referensi tombol submit untuk memberikan efek "Loading"
    const submitBtn = document.getElementById('submitBtn'); // Pastikan tombol submit memiliki id="submitBtn"
    const originalBtnText = submitBtn.innerText;
    submitBtn.innerText = "Memproses Deployment (Mohon Tunggu)...";
    submitBtn.disabled = true;

    try {
        // 2. Susun Data Payload JSON
        const clientData = {
            // A. Data Utama Klien & Cloudflare
            name: document.getElementById("name").value.trim(),
            domain: document.getElementById("domain").value.trim(),
            accountId: document.getElementById("accountId").value.trim(),
            token: document.getElementById("token").value.trim(),
            workerName: document.getElementById("workerName").value.trim(),
            kvId: document.getElementById("kvId").value.trim(),
            databaseId: document.getElementById("databaseId").value.trim(),

            // B. Variabel Environment Biasa (Plain Text)
    vars: {
        // --- 1. Repo Pusat untuk Render UI Dashboard (Selalu Milik Anda) ---
        "GITHUB_ADMIN_OWNER": "adicore", 
        "GITHUB_ADMIN_REPO": "dashboard_travego",
        
        // --- 2. Repo Frontend untuk Simpan Artikel (Milik Klien) ---
        "GITHUB_OWNER": document.getElementById("githubOwner").value.trim(),
        "GITHUB_REPO": document.getElementById("githubRepo").value.trim()
    },
            
            // C. Variabel Rahasia (Encrypted Secrets)
            secrets: {
                "GITHUB_PAT": document.getElementById("githubPat").value.trim(),
                "GROQ_API_KEY": document.getElementById("groqApiKey").value.trim()
            }
        };

        // 3. Tembak API Worker Pusat
        const response = await fetch("https://dashboard-admin-pusat.accessed.workers.dev/api/register-client", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(clientData)
        });

        // 4. Parsing JSON Respons dari Server
        const result = await response.json();

        // 5. Evaluasi Hasil
        if (response.ok && result.success) {
            alert("🎉 Pendaftaran Berhasil!\n\nSistem telah mendeploy Worker, Cron, Queue, dan menginjeksi Secrets klien ke Cloudflare.");
            
            // Opsional: Mengosongkan form setelah sukses
            document.getElementById('registerForm').reset();
        } else {
            console.error("Detail Error API:", result);
            alert("❌ Proses Gagal:\n" + (result.error || "Terjadi kesalahan di server pusat."));
        }

    } catch (err) {
        // Penanganan error jika gagal koneksi (misal internet putus atau Worker Pusat down)
        console.error("Error Jaringan:", err);
        alert("⚠️ Terjadi kesalahan jaringan. Gagal terhubung ke server pusat.");
    } finally {
        // 6. Kembalikan kondisi tombol seperti semula
        submitBtn.innerText = originalBtnText;
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
