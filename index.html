<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran & Checkout - SaaS Travego</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: 40px auto; }
        h2 { color: #333; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #444; font-size: 14px; }
        input, select { width: 100%; padding: 11px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #ff6600; outline: none; box-shadow: 0 0 5px rgba(255, 102, 0, 0.3); }
        .section-title { font-size: 16px; color: #ff6600; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px; margin-bottom: 15px; }
        button { width: 100%; background: #ff6600; color: white; border: none; padding: 14px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-top: 20px;}
        button:hover { background: #e55b00; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .billing-box { background: #fff3e6; border: 1px solid #ffcc99; padding: 15px; border-radius: 6px; margin-top: 20px; text-align: center; }
        .billing-title { font-size: 14px; color: #555; margin-bottom: 5px; }
        .billing-price { font-size: 28px; font-weight: bold; color: #ff6600; }
        .note { font-size: 12px; color: #777; margin-top: 4px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2>Registrasi Klien SaaS Travego</h2>
    <div class="subtitle">Pilih paket dan buat akun admin Anda. Pengaturan teknis dilakukan setelah pembayaran.</div>
    
    <form id="registerForm">
        <div class="section-title">1. Pemilihan Produk & Harga</div>
        <div class="form-group">
            <label for="dashboardVersion">Pilih Versi Dashboard (Template):</label>
            <select id="dashboardVersion" onchange="updatePrice()" required>
                <option value="" disabled selected>-- Pilih Versi Website --</option>
                <option value="v1_blog" data-price="35.00">v1_blog (Blog Standar) - $35.00</option>
                <option value="v2_travel" data-price="99.00">v2_travel (Travel & Affiliate) - $99.00</option>
                <option value="v3_ecommerce" data-price="129.00">v3_ecommerce (Toko Online) - $129.00</option>
            </select>
        </div>

        <div class="section-title">2. Data Profil & Akun Admin</div>
        <div class="form-group">
            <label>Nama Anda / Perusahaan:</label>
            <input type="text" id="name" required placeholder="Contoh: Budi Santoso">
        </div>
        <div class="form-group">
            <label>Domain Target Website:</label>
            <input type="text" id="domain" placeholder="Contoh: travelbudi.com" required>
        </div>
        <div class="form-group">
            <label for="clientEmail">Email (Untuk Login Dasbor):</label>
            <input type="email" id="clientEmail" placeholder="email.klien@gmail.com" required>
        </div>
        <div class="form-group">
            <label for="clientPassword">Kata Sandi Dasbor:</label>
            <input type="password" id="clientPassword" placeholder="••••••••" required>
        </div>

        <div class="billing-box">
            <div class="billing-title">Total Pembayaran Anda:</div>
            <div class="billing-price" id="totalPriceDisplay">$0.00</div>
            <div class="note mt-2">Anda akan diarahkan ke halaman pembayaran PayPal aman.</div>
        </div>
        
        <button type="submit" id="submitBtn">Daftar & Lanjutkan ke Pembayaran</button>
    </form>
</div>

<script>
function updatePrice() {
    const select = document.getElementById("dashboardVersion");
    if(select.selectedIndex === 0) return; 
    const price = parseFloat(select.options[select.selectedIndex].getAttribute("data-price") || "0");
    document.getElementById("totalPriceDisplay").innerText = "$" + price.toFixed(2);
}

document.getElementById('registerForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const originalBtnText = submitBtn.innerText;
    
    const selectVersion = document.getElementById("dashboardVersion");
    const dashboardVersion = selectVersion.value;
    const priceAmount = parseFloat(selectVersion.options[selectVersion.selectedIndex].getAttribute("data-price") || "0").toFixed(2);

    submitBtn.innerHTML = '⏳ Menyiapkan Checkout PayPal...';
    submitBtn.disabled = true;

    // Simpan data dasar di LocalStorage untuk digunakan di halaman onboarding nanti
    const clientBasicData = {
        product_version: dashboardVersion,
        amount: priceAmount,
        name: document.getElementById("name").value.trim(),
        email: document.getElementById("clientEmail").value.trim(),
        password: document.getElementById("clientPassword").value.trim(),
        domain: document.getElementById("domain").value.trim()
    };
    localStorage.setItem('travego_setup_data', JSON.stringify(clientBasicData));

    try {
        const response = await fetch("https://dashboard-admin-pusat.accessed.workers.dev/api/create-checkout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(clientBasicData)
        });

        const result = await response.json();

        if (response.ok && result.success && result.checkout_url) {
            window.location.href = result.checkout_url;
        } else {
            alert("❌ Gagal memproses tagihan PayPal:\n" + (result.error || "Terjadi kesalahan."));
            submitBtn.innerText = originalBtnText;
            submitBtn.disabled = false;
        }
    } catch (err) {
        alert("⚠️ Gagal terhubung ke server pusat. Silakan coba lagi.");
        submitBtn.innerText = originalBtnText;
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
